name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hq_geap_test
          POSTGRES_USER: hq_geap
          POSTGRES_PASSWORD: hq_geap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hq_geap -d hq_geap_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://hq_geap:hq_geap@127.0.0.1:5432/hq_geap_test
      TEST_DATABASE_URL: postgres://hq_geap:hq_geap@127.0.0.1:5432/hq_geap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm db:validate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
