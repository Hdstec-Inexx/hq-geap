# Referência para serviço Compose no Easypanel.
# Preferência do painel: Domains apontando para api:3015 e web:8025 (sem publicar ports no host).
# Credenciais e URLs públicas vêm das Environment Variables do Easypanel.
# PostgreSQL é externo: informe DATABASE_URL apontando para o DB já provisionado.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3015
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-28800}
      INGESTION_API_KEY: ${INGESTION_API_KEY:?set INGESTION_API_KEY}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:?set STORAGE_PROVIDER}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-hq-geap}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:?set STORAGE_PUBLIC_URL}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:?set ELEVENLABS_API_KEY}
      ELEVENLABS_API_URL: ${ELEVENLABS_API_URL:-https://api.elevenlabs.io}
      SKIP_DB_SEED: ${SKIP_DB_SEED:-0}
    expose:
      - '3015'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3015)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - '8025'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8025/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
