services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hq_geap
      POSTGRES_USER: hq_geap
      POSTGRES_PASSWORD: hq_geap
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hq_geap -d hq_geap"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - hq_geap_postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  hq_geap_postgres:
