services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hq_geap
      POSTGRES_USER: hq_geap
      POSTGRES_PASSWORD: hq_geap
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hq_geap -d hq_geap"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - hq_geap_postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - hq_geap_minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/hq-geap-audio &&
      mc anonymous set download local/hq-geap-audio"

volumes:
  hq_geap_postgres:
  hq_geap_minio:
